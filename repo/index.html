<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover inspiring images for nature, art, architecture, travel and more.">
  <title>PixelPulse - Inspiration Gallery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>PixelPulse</h1>
    <p>Find inspiration. Explore creativity.</p>
  </header>

  <main>
    <section class="search-section">
      <h2>Find Your Inspiration</h2>
      <p>Search for images that inspire you.</p>

      <form id="search-form">
        <label for="search-input">Search images</label>
        <div class="search-controls">
          <input
            type="search"
            id="search-input"
            name="query"
            placeholder="Try nature, art, travel..."
            autocomplete="off"
          >
          <button type="submit" id="search-button">Search</button>
        </div>
      </form>
    </section>

    <section class="categories-section">
      <h2>Explore Categories</h2>
      <div class="categories">
        <button type="button" class="category" data-category="nature">🌿 Nature</button>
        <button type="button" class="category" data-category="architecture">🏛️ Architecture</button>
        <button type="button" class="category" data-category="art">🎨 Art</button>
        <button type="button" class="category" data-category="travel">✈️ Travel</button>
        <button type="button" class="category" data-category="ocean">🌊 Ocean</button>
      </div>
    </section>

    <section class="results-section">
      <h2>Inspiration Gallery</h2>
      <p id="status-message" role="status" aria-live="polite">
        Search for a topic or select a category to begin.
      </p>
      <div id="results-container" class="results-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>PixelPulse — A little inspiration goes a long way.</p>
  </footer>
</body>
</html>
